name: setu
description: "On|Bed — Your Machine, Even in Bed. Mobile remote development client for Linux workstations."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartssh2: ^3.3.1
  xterm: ^4.0.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^17.5.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  smooth_page_indicator: ^3.0.0
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  local_auth: ^3.0.2
  path: ^1.9.1
  intl: ^0.20.3
  equatable: ^2.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D1117"
  color_dark: "#0D1117"
  image: assets/images/logo_mark_transparent.png
  android_12:
    color: "#0D1117"
    icon_background_color: "#0D1117"
    image: assets/images/logo_mark_transparent.png

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
